[tool.poetry]
name = "kpilot"
version = "0.1.0"
description = "Library for Generating Plots for KPI indicators"
authors = ["Pablo Torres <pablo.torres@example.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
pyspark = "*"
pandas = "*"
matplotlib = "^3.8.0"
pillow = "^10.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
